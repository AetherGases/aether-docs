const edges=[...svg.querySelectorAll('.edge')];edges.forEach(edge=>{edge.addEventListener('pointerenter',()=>edge.classList.add('active'));edge.addEventListener('pointerleave',()=>edge.classList.remove('active'));});svg.querySelectorAll('.node').forEach(node=>{node.addEventListener('pointerenter',()=>edges.filter(edge=>edge.dataset.parent===node.dataset.table||edge.dataset.child===node.dataset.table).forEach(edge=>edge.classList.add('active')));node.addEventListener('pointerleave',()=>edges.forEach(edge=>edge.classList.remove('active')));});

function showTable(key){document.getElementById('detail-title').textContent=key;const rows=DATA.tables[key].map(c=>'<tr><td><code>'+esc(c.name)+'</code></td><td>'+esc(c.type)+'</td><td>'+esc(c.reference||'—')+'</td></tr>').join('');document.getElementById('detail-body').innerHTML='<table class="info-table"><thead><tr><th>Column</th><th>Type</th><th>References</th></tr></thead><tbody>'+rows+'</tbody></table><h3>DDL · defaults, checks, unique keys and delete rules</h3><pre>'+esc(DATA.ddl[key])+'</pre>';dialog.showModal();}
document.getElementById('enums').onclick=()=>{document.getElementById('detail-title').textContent='Domínios ENUM';document.getElementById('detail-body').innerHTML=Object.entries(DATA.enums).map(([name,values])=>'<h3>'+esc(name)+'</h3><pre>'+esc(values.join(' · '))+'</pre>').join('');dialog.showModal();};document.getElementById('close').onclick=()=>dialog.close();
