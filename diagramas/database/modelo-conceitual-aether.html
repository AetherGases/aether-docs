<script>
const svg=document.getElementById('model'), viewport=document.getElementById('viewport');
const box=svg.viewBox.baseVal, W=box.width,H=box.height; let scale=1;
function setZoom(next,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const x=(viewport.scrollLeft+cx)/scale,y=(viewport.scrollTop+cy)/scale;scale=Math.max(.08,Math.min(2.5,next));svg.style.width=(W*scale)+'px';svg.style.height=(H*scale)+'px';viewport.scrollLeft=x*scale-cx;viewport.scrollTop=y*scale-cy;document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}
function fit(){setZoom(Math.min((viewport.clientWidth-24)/W,(viewport.clientHeight-24)/H));viewport.scrollLeft=0;viewport.scrollTop=0;}
document.getElementById('plus').onclick=()=>setZoom(scale*1.2);
document.getElementById('minus').onclick=()=>setZoom(scale/1.2);
document.getElementById('fit').onclick=fit;
document.getElementById('actual').onclick=()=>setZoom(1);
document.getElementById('print').onclick=()=>window.print();
viewport.addEventListener('wheel',ev=>{if(ev.ctrlKey||ev.metaKey){ev.preventDefault();const r=viewport.getBoundingClientRect();setZoom(scale*Math.exp(-ev.deltaY*.002),ev.clientX-r.left,ev.clientY-r.top);}},{passive:false});
let drag=null;
viewport.addEventListener('pointerdown',ev=>{if(ev.pointerType!=='mouse'||ev.button!==0)return;drag={x:ev.clientX,y:ev.clientY,l:viewport.scrollLeft,t:viewport.scrollTop};viewport.classList.add('dragging');viewport.setPointerCapture(ev.pointerId);});
viewport.addEventListener('pointermove',ev=>{if(!drag)return;viewport.scrollLeft=drag.l+drag.x-ev.clientX;viewport.scrollTop=drag.t+drag.y-ev.clientY;});
function endDrag(){drag=null;viewport.classList.remove('dragging');}
viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
viewport.addEventListener('keydown',ev=>{if(ev.key==='+'||ev.key==='='){ev.preventDefault();setZoom(scale*1.2);}if(ev.key==='-'){ev.preventDefault();setZoom(scale/1.2);}});
const copy=svg.cloneNode(true);copy.removeAttribute('style');copy.setAttribute('xmlns','http://www.w3.org/2000/svg');copy.setAttribute('width',W);copy.setAttribute('height',H);
const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='.edge text{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round;fill:#183a40;font-weight:600}';copy.prepend(style);
const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'}));document.getElementById('download').href=url;
document.querySelectorAll('#model .edge').forEach(edge=>{
 const id=edge.dataset.relationship;
 const targets=[...document.querySelectorAll('#model .edge')].filter(x=>x.dataset.relationship===id);
 const diamond=[...document.querySelectorAll('#model .node')].find(x=>x.querySelector('title')?.textContent===id);
 edge.addEventListener('pointerenter',()=>{targets.forEach(x=>x.classList.add('is-active'));diamond?.classList.add('is-active');});
 edge.addEventListener('pointerleave',()=>{targets.forEach(x=>x.classList.remove('is-active'));diamond?.classList.remove('is-active');});
});
setZoom(1);viewport.scrollLeft=0;viewport.scrollTop=0;
</script></body></html>
