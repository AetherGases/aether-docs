openapi: 3.0.3

paths:

  /aether-api/v1/ai/user/{id_external_user}:
    get:
      summary: Get AI user information
      parameters:
        - name: id_external_user
          in: path
          required: true
          schema:
            type: integer
          description: Reference identifier of the external user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_external_user:
                    type: integer
                    description: Reference identifier of the external user
                  role:
                    type: string
                    description: User's role when interacting with the AI
                  usecase:
                    type: string
                    description: Permanent description of the user's AI usage patterns
        '401':
          description: Unauthorized. Invalid or missing authentication token
        '404':
          description: User not found
        '500':
          description: Internal server error


  /aether-api/v1/ai/session/{id_external_user}:
    get:
      summary: Get user AI sessions
      parameters:
        - name: id_external_user
          in: path
          required: true
          schema:
            type: integer
          description: Reference identifier of the external user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id_external_user:
                      type: integer
                      description: Reference identifier of the external user
                    name:
                      type: string
                      description: Name of the session
                    messages:
                      type: array
                      description: List of messages exchanged within the session
                      items:
                        type: object
                        properties:
                          input:
                            type: string
                            description: User input message
                          output:
                            type: string
                            description: AI-generated response
                          submitted_at:
                            type: string
                            format: date-time
                            description: Date and time when the message was submitted
                          llm:
                            type: string
                            description: Language model used to generate the response
                          input_tokens:
                            type: integer
                            description: Number of tokens used in the input
                          output_tokens:
                            type: integer
                            description: Number of tokens used in the output
        '401':
          description: Unauthorized. Invalid or missing authentication token
        '404':
          description: No sessions found for the user
        '500':
          description: Internal server error


  /aether-api/v1/ai/gas-reduction/{id_external_gas_reduction}/improvement-plan:
    get:
      summary: Get gas reduction improvement plan
      parameters:
        - name: id_external_gas_reduction
          in: path
          required: true
          schema:
            type: integer
          description: Reference identifier of the external gas reduction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Improvement plan retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  defined_problem:
                    type: string
                    description: Summary of the identified problem
                  method:
                    type: string
                    description: Proposed method to solve the problem
                  reasoning:
                    type: string
                    description: Explanation of why the proposed method should solve the problem
                  updated_at:
                    type: string
                    format: date-time
                    description: Date and time of the last update
        '401':
          description: Unauthorized. Invalid or missing authentication token
        '404':
          description: Gas reduction improvement plan not found
        '500':
          description: Internal server error


  /aether-api/v1/ai/message:
    post:
      summary: Send message to AI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
                - session_id
              properties:
                input:
                  type: string
                  description: User input message
                session_id:
                  type: string
                  description: Identifier of the AI session
      responses:
        '200':
          description: Message processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                    description: AI-generated response content
                  submitted_at:
                    type: string
                    format: date-time
                    description: Date and time when the message was submitted
                  llm:
                    type: string
                    description: Language model used to generate the response
                  input_tokens:
                    type: integer
                    description: Number of tokens used in the input
                  output_tokens:
                    type: integer
                    description: Number of tokens used in the output
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized. Invalid or missing authentication token
        '404':
          description: Session not found
        '500':
          description: Internal server error


  /aether-api/v1/ai/report:
    post:
      summary: Process report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_external_user
                - input_report_path
              properties:
                id_external_user:
                  type: integer
                  description: Reference identifier of the external user
                id_external_gas_reduction:
                  type: integer
                  nullable: true
                  description: Reference identifier of the external gas reduction. If null, a new gas reduction will be created
                input_report_path:
                  type: string
                  description: Storage path where the report file is located
      responses:
        '200':
          description: Report processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_external_report:
                    type: integer
                    description: Reference identifier of the external report
                  gas:
                    type: string
                    description: Gas identified in the input report
                  emitted_tons:
                    type: number
                    format: float
                    description: Amount of emitted gas in tons
                  observations:
                    type: array
                    description: List of additional observations
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          description: Observation text
        '400':
          description: Invalid report data
        '401':
          description: Unauthorized. Invalid or missing authentication token
        '404':
          description: Referenced resource not found
        '500':
          description: Internal server error


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT