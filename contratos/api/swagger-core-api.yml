  /api/roi-calculator/simulate:
    post:
      tags:
        - ROI Calculator
      summary: Simula a substituição de um gás poluente por uma alternativa verde.
      description: >
        Recebe o gás atual, o volume emitido, o escopo, a alternativa verde escolhida
        e o prazo desejado para neutralização (etapas "Emissão Atual", "Gás Verde" e
        "Prazo" da calculadora), e retorna o resultado principal, o impacto da
        substituição, a série de redução ao longo do tempo e o retorno financeiro
        estimado (tela "Resultados"). Não persiste dados — cálculo sob demanda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoiSimulationRequestDTO'
      responses:
        '200':
          description: Simulação calculada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoiSimulationOutputDTO'
              example:
                mainResult:
                  quantityCo2e: 817
                  percentageOfTotalEmitted: 28
                  unit: "tCO2e/mês"
                substitutionImpact:
                  neutralizedQuantityCo2e: 423
                  greenAlternativeName: "Biometano"
                reductionOverTime:
                  - month: 1
                    quantityCo2e: 780
                  - month: 2
                    quantityCo2e: 690
                  - month: 3
                    quantityCo2e: 540
                  - month: 4
                    quantityCo2e: 460
                  - month: 5
                    quantityCo2e: 423
                financialReturn:
                  monthlyEstimatedSavings: 87400
                  initialInvestment: 1220000
        '400':
          description: Dados inválidos (prazo ou volume informado incorretamente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O volume emitido por mês deve ser maior que zero.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Gás, escopo ou alternativa verde informados não encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Alternativa verde não encontrada.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/inventory/{inventoryId}/simulate:
    post:
      tags:
        - ROI Calculator
      summary: Simula e salva uma substituição vinculada a um inventário.
      description: >
        Mesmo cálculo de `/api/roi-calculator/simulate`, mas vinculado a um
        inventário existente e persistido na tabela reduction — é o que alimenta
        os blocos "Substituição prioritária" e "Substituição secundária" na tela
        de Análise do inventário. O campo `priority` define em qual dos dois
        blocos o resultado aparece.
      security:
        - bearerAuth: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RoiSimulationRequestDTO'
                - type: object
                  required:
                    - priority
                  properties:
                    priority:
                      type: string
                      enum: [PRIMARY, SECONDARY]
                      description: Define se o resultado aparece como "Substituição prioritária" ou "secundária".
      responses:
        '201':
          description: Simulação vinculada ao inventário e salva com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoiSimulationOutputDTO'
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O volume emitido por mês deve ser maior que zero.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Inventário, gás, escopo ou alternativa verde não encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Inventário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequestDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@email.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          example: senha123

    SendCodeRequestDTO:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@email.com

    ValidateCodeRequestDTO:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: user@email.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    ConfirmResetPasswordRequestDTO:
      type: object
      required:
        - email
        - code
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: user@email.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 28
          example: novaSenha123
        confirmedPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 28
          example: novaSenha123

    LoginOutputDTO:
      type: object
      properties:
        token:
          type: string
          description: A JWT token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.dyt0CoTl4WoVjAHI9Q_CwSKhl6d_9rhM3NrXuJttkao

    ValidateCodeOutputDTO:
      type: object
      properties:
        message:
          type: string
          example: Código validado com sucesso.

    ErrorOutputDTO:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
          
    UpdateEmployeeRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: João da Silva
        email:
          type: string
          format: email
          maxLength: 150
          example: joao.silva@email.com
        phone:
          type: string
          minLength: 8
          maxLength: 20
          example: "11987654321"
        idStorageFile:
          type: integer
          nullable: true
          example: 42

    EmployeeOutputDTO:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João da Silva
        email:
          type: string
          format: email
          example: joao.silva@email.com
        phone:
          type: string
          example: "11987654321"
        idStorageFile:
          type: integer
          nullable: true
          description: Referência do arquivo de foto/avatar armazenado.
          example: 42
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ChangePasswordRequestDTO:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: senha123
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          example: novaSenha456
        confirmPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          example: novaSenha456

    # ---------------------------------------------------
    # Inventory
    # ---------------------------------------------------
    InventoryStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
      description: >
        Status persistido do inventário. "LATE" (Atrasado), visto nos filtros
        de histórico, não é persistido — é calculado comparando dueDate com
        a data atual apenas para inventários em PENDING.

    CreateInventoryRequestDTO:
      type: object
      required:
        - name
        - inventoryingPeriodStart
        - inventoryingPeriodEnd
        - idDepartment
        - idValidatorEmployee
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Relatório sobre fulano the town"
        description:
          type: string
          maxLength: 150
        consolidationApproach:
          type: string
          maxLength: 100
        inventoryingPeriodStart:
          type: string
          format: date
        inventoryingPeriodEnd:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: Prazo para revisão do inventário pelo validador.
        idDepartment:
          type: integer
        idValidatorEmployee:
          type: integer
          description: Funcionário (gerente) responsável por aprovar/reprovar o inventário.
        idStorageFile:
          type: integer
          nullable: true

    InventoryOutputDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/InventoryStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    InventoryDetailOutputDTO:
      allOf:
        - $ref: '#/components/schemas/InventoryOutputDTO'
        - type: object
          properties:
            description:
              type: string
            inventoryingPeriodStart:
              type: string
              format: date
            inventoryingPeriodEnd:
              type: string
              format: date
            dueDate:
              type: string
              format: date
              nullable: true
            createdAt:
              type: string
              format: date-time
            ownerEmployeeName:
              type: string
            validatorEmployeeName:
              type: string

    InventoryHistoryItemDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/InventoryStatus'
        ownerEmployeeName:
          type: string
        submittedAt:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true

    InventoryHistoryOutputDTO:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryHistoryItemDTO'

    RejectInventoryRequestDTO:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: "O envio de acessórios e itens de vestuário digitáveis apresentados diverge do relatório anterior."

    ScopeOutputDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    CategoryOutputDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        classification:
          type: string
          enum: [UPSTREAM, DOWNSTREAM]
          nullable: true

    CreateEmissionRequestDTO:
      type: object
      required:
        - idGas
        - idScope
        - quantityCo2e
      properties:
        idGas:
          type: integer
          description: Gás poluente selecionado no dropdown "Tipo de gás poluente".
        idScope:
          type: integer
        idCategory:
          type: integer
          nullable: true
          description: Obrigatório apenas quando o escopo selecionado for Escopo 3.
        quantityCo2e:
          type: number
          description: Volume emitido por mês, já em tCO2e/mês.
          example: 1700
        methodologyDescription:
          type: string
          maxLength: 150
          nullable: true
        supplierDataPercentage:
          type: number
          minimum: 0
          maximum: 100
          nullable: true

    UpdateEmissionRequestDTO:
      type: object
      properties:
        idGas:
          type: integer
        idScope:
          type: integer
        idCategory:
          type: integer
          nullable: true
        quantityCo2e:
          type: number
        methodologyDescription:
          type: string
          maxLength: 150
          nullable: true
        supplierDataPercentage:
          type: number
          minimum: 0
          maximum: 100
          nullable: true

    EmissionOutputDTO:
      type: object
      properties:
        id:
          type: integer
        quantityCo2e:
          type: number
        methodologyDescription:
          type: string
          nullable: true
        supplierDataPercentage:
          type: number
          nullable: true
        gas:
          $ref: '#/components/schemas/GasOutputDTO'
        scope:
          $ref: '#/components/schemas/ScopeOutputDTO'
        category:
          $ref: '#/components/schemas/CategoryOutputDTO'
          nullable: true
        createdAt:
          type: string
          format: date-time

    GasOutputDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        formula:
          type: string
        isBiogenic:
          type: boolean
        gwp:
          type: number

    GreenAlternativeOutputDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Biometano"
        equivalentGasFormula:
          type: string
          example: "CH4"

    RoiSimulationRequestDTO:
      type: object
      required:
        - idScope
        - idGas
        - currentVolumeCo2e
        - idGreenAlternative
        - termMonths
      properties:
        idScope:
          type: integer
          description: Escopo da emissão atual (dropdown "Escopo" da etapa "Emissão Atual").
        idGas:
          type: integer
          description: Gás poluente atual.
        currentVolumeCo2e:
          type: number
          description: Volume emitido por mês, em tCO2e/mês.
          example: 1700
        idGreenAlternative:
          type: integer
          description: Alternativa verde escolhida para simular a substituição.
        termMonths:
          type: integer
          description: Prazo, em meses, que o usuário deseja para neutralizar a emissão.
          minimum: 1
          example: 6

    RoiSimulationOutputDTO:
      type: object
      properties:
        mainResult:
          type: object
          properties:
            quantityCo2e:
              type: number
              example: 817
            percentageOfTotalEmitted:
              type: number
              description: Percentual do total emitido que essa substituição representa.
              example: 28
            unit:
              type: string
              example: "tCO2e/mês"
        substitutionImpact:
          type: object
          properties:
            neutralizedQuantityCo2e:
              type: number
              example: 423
            greenAlternativeName:
              type: string
              example: "Biometano"
        reductionOverTime:
          type: array
          description: Série usada no gráfico "Redução ao longo do tempo".
          items:
            type: object
            properties:
              month:
                type: integer
              quantityCo2e:
                type: number
        financialReturn:
          type: object
          properties:
            monthlyEstimatedSavings:
              type: number
              description: Economia mensal estimada, em R$.
              example: 87400
            initialInvestment:
              type: number
              description: Investimento inicial necessário, em R$.
              example: 1220000