openapi: 3.0.3
info:
  title: Aether Core API
  version: 1.0.0
  description: HTTP API para autenticação, gestão de inventários de emissões, cálculo de retorno (ROI) e emissão de relatórios.
servers:
  - url: /

tags:
  - name: Auth
    description: Rotas para realizar autenticação e troca de senhas ao esquecer.
  - name: Profile
    description: Rotas para consultar e editar os dados do funcionário autenticado.
  - name: Inventory
    description: Rotas para envio, aprovação, reprovação e consulta do histórico de inventários (relatórios) de emissões.
  - name: ROI Calculator
    description: Rotas para simular a substituição de um gás poluente por uma alternativa verde e estimar redução de emissões, retorno financeiro e investimento inicial.
  - name: Emission
    description: Rotas para cadastro, edição, remoção e consulta de emissões dentro de um inventário.

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Realiza login um usuário no sistema.
      description: Busca e valida a senha de um usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutputDTO'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.dyt0CoTl4WoVjAHI9Q_CwSKhl6d_9rhM3NrXuJttkao
        '401':
          description: Login incorreto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Usuário e/ou senha inválidos.
                status: 401
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Usuário e/ou senha inválidos.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/auth/refresh/{email}:
    post:
      tags:
        - Auth
      summary: Atualiza o JWT Token.
      description: Valida o JWT Token atual e gera um novo.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutputDTO'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.dyt0CoTl4WoVjAHI9Q_CwSKhl6d_9rhM3NrXuJttkao
        '401':
          description: Login incorreto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Usuário e/ou senha inválidos.
                status: 401
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Usuário e/ou senha inválidos.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/auth/reset-password/send-code:
    post:
      tags:
        - Auth
      summary: Envia um código para validar e trocar a senha.
      description: Busca um usuário, caso exista envia um código para o e-mail informado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequestDTO'
      responses:
        '204':
          description: Código enviado com sucesso.
        '400':
          description: E-mail inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O e-mail informado possui formato inválido.
                status: 400
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/auth/reset-password/validate-code:
    post:
      tags:
        - Auth
      summary: Valida se o código enviado para o usuário está correto.
      description: Verifica se o código informado como parâmetro é válido para o e-mail informado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodeRequestDTO'
      responses:
        '200':
          description: Código validado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCodeOutputDTO'
              example:
                message: Código validado com sucesso.
        '400':
          description: Código inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O código informado é inválido ou expirou.
                status: 400
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/auth/reset-password/confirm:
    post:
      tags:
        - Auth
      summary: Confirma a troca de senha após a validação do código.
      description: Verifica novamente se o código informado é válido para o e-mail e, em caso positivo, atualiza a senha do usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmResetPasswordRequestDTO'
      responses:
        '204':
          description: Senha alterada com sucesso.
        '400':
          description: Código inválido, expirado ou senha em formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O código informado é inválido ou expirou.
                status: 400
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Usuário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500
                
  /api/profile/me:
    get:
      tags:
        - Profile
      summary: Retorna os dados do funcionário autenticado.
      description: Busca os dados do employee vinculado ao token JWT enviado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOutputDTO'
              example:
                id: 1
                name: João da Silva
                email: joao.silva@email.com
                phone: "11987654321"
                idStorageFile: 42
                createdAt: "2025-01-10T14:30:00"
                updatedAt: "2025-03-02T09:15:00"
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Funcionário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

    patch:
      tags:
        - Profile
      summary: Edita os dados do funcionário autenticado.
      description: Atualiza name, email, phone e/ou idStorageFile do employee vinculado ao token JWT enviado. Não altera a senha.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequestDTO'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOutputDTO'
              example:
                id: 1
                name: João da Silva
                email: joao.silva@email.com
                phone: "11987654321"
                idStorageFile: 42
                createdAt: "2025-01-10T14:30:00"
                updatedAt: "2025-08-07T10:00:00"
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O e-mail informado possui formato inválido.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Funcionário não encontrado.
                status: 404
        '409':
          description: E-mail já cadastrado para outro funcionário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Este e-mail já está em uso por outro funcionário.
                status: 409
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/profile/me/password:
    patch:
      tags:
        - Profile
      summary: Troca a senha do funcionário autenticado.
      description: Valida a senha atual e, caso confira, atualiza para a nova senha informada. Rota separada da edição de dados por exigir a senha atual como confirmação.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestDTO'
      responses:
        '204':
          description: Senha alterada com sucesso.
        '400':
          description: Nova senha em formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: A nova senha deve ter entre 6 e 100 caracteres.
                status: 400
        '401':
          description: Token ausente/inválido ou senha atual incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Senha atual incorreta.
                status: 401
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Funcionário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/inventory:
    post:
      tags:
        - Inventory
      summary: Envia um novo inventário para análise.
      description: Cria um inventário vinculado ao funcionário autenticado (owner) e o envia para revisão do funcionário validador informado. Status inicial é PENDING.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequestDTO'
      responses:
        '201':
          description: Inventário enviado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOutputDTO'
              example:
                id: 12
                name: "Relatório sobre fulano the town"
                status: PENDING
                submittedAt: "2026-03-20T09:14:00"
                reviewedAt: null
                rejectionReason: null
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O período de inventário informado é inválido.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Departamento ou funcionário validador não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Funcionário validador não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

    get:
      tags:
        - Inventory
      summary: Lista o histórico de inventários.
      description: Retorna os inventários visíveis para o funcionário autenticado, com busca por nome, filtro por status e ordenação por data de envio. Usado nas telas de "Histórico".
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filtra pelo nome do relatório/empresa.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, LATE]
          description: LATE representa inventários PENDING cujo dueDate já expirou (calculado, não persistido).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [RECENT, OLDEST]
            default: RECENT
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Histórico retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHistoryOutputDTO'
              example:
                total: 5
                page: 1
                pageSize: 20
                items:
                  - id: 12
                    name: "Relatório sobre fulano the town"
                    status: PENDING
                    ownerEmployeeName: "Daniel Sagaz"
                    submittedAt: "2026-03-20T09:14:00"
                    dueDate: "2026-07-24"
                  - id: 11
                    name: "Relatório sobre fulano the town"
                    status: APPROVED
                    ownerEmployeeName: "Daniel Sagaz"
                    submittedAt: "2026-02-28T15:02:00"
                    dueDate: "2026-06-24"
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/inventory/{id}:
    get:
      tags:
        - Inventory
      summary: Retorna os dados detalhados de um inventário.
      description: Busca um inventário pelo id, com os dados necessários para a tela de revisão (identificação, status, período, criador e validador).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inventário retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDetailOutputDTO'
              example:
                id: 12
                name: "JBS S.A."
                status: PENDING
                description: "Descrição do inventário enviado para análise."
                inventoryingPeriodStart: "2025-07-23"
                inventoryingPeriodEnd: "2025-08-20"
                dueDate: "2026-07-24"
                createdAt: "2026-05-29T08:14:00"
                submittedAt: "2026-05-29T09:00:00"
                reviewedAt: null
                rejectionReason: null
                ownerEmployeeName: "Daniel Sagaz"
                validatorEmployeeName: "Nisfiel Grandão"
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '404':
          description: Inventário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Inventário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/inventory/{id}/approve:
    patch:
      tags:
        - Inventory
      summary: Aprova um inventário.
      description: Muda o status do inventário de PENDING para APPROVED. Somente o funcionário validador vinculado ao inventário pode executar esta ação.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inventário aprovado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOutputDTO'
              example:
                id: 12
                status: APPROVED
                reviewedAt: "2026-05-31T10:22:00"
                rejectionReason: null
        '400':
          description: Inventário não está pendente e não pode ser aprovado novamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Este inventário já foi analisado e não pode ser aprovado novamente.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '403':
          description: Funcionário sem permissão para aprovar este inventário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Você não tem permissão para aprovar este inventário.
                status: 403
        '404':
          description: Inventário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Inventário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/inventory/{id}/reject:
    patch:
      tags:
        - Inventory
      summary: Reprova um inventário.
      description: Muda o status do inventário de PENDING para REJECTED. Exige um motivo, exibido posteriormente para quem enviou o relatório (campo "Relatório reprovado" nas telas de análise).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectInventoryRequestDTO'
      responses:
        '200':
          description: Inventário reprovado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOutputDTO'
              example:
                id: 12
                status: REJECTED
                reviewedAt: "2026-05-31T10:22:00"
                rejectionReason: "O envio de acessórios e itens de vestuário digitáveis apresentados diverge do relatório anterior."
        '400':
          description: Motivo da reprovação não informado ou inventário não está pendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: O motivo da reprovação é obrigatório.
                status: 400
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '403':
          description: Funcionário sem permissão para reprovar este inventário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Você não tem permissão para reprovar este inventário.
                status: 403
        '404':
          description: Inventário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Inventário não encontrado.
                status: 404
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/scope:
    get:
      tags:
        - Emission
      summary: Lista os escopos disponíveis.
      description: Retorna Escopo 1, 2 e 3, usados no dropdown "Escopo" da etapa "Emissão Atual".
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Escopos retornados com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopeOutputDTO'
              example:
                - id: 1
                  name: "Escopo 1"
                - id: 2
                  name: "Escopo 2"
                - id: 3
                  name: "Escopo 3"
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Token inválido ou expirado.
                status: 401
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutputDTO'
              example:
                message: Ocorreu um erro inesperado, tente novamente mais tarde.
                status: 500

  /api/category:
    get:
      tags:
        - Emission
      summary: Lista as categorias disponíveis.
      description: Retorna as categorias do GHG Protocol (relevantes principalmente para emissões de Escopo 3, upstream/downstream). Opcional na etapa "Emissão Atual", quando o escopo selecionado for Escopo 3.
      security:
        - bearerAuth: []
